<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>입력 필드를 만든다</h1>
    <!--size="20":입력창의 크기, maxlength="15":입력받을 수 있는 최대 글자 수-->
    <input type="text" placeholder="텍스트를 입력하세요" 
            maxlength="15" size="20">

    <h1>type="text" & type="password"</h1>
    <input type="text" placeholder="아이디를 입력하세요">
    <br>
    <input type="password" placeholder="비밀번호를 입력하세요">

    <h1>type="number"</h1>
    사과 <input type="number" min="0" max="10" step="1">개 주세요!

    <h1>type="color"</h1>
    <input type="color">

    <h1>type="button"</h1>
    <input type="button" value="PUSH">

    <p>좋아하는 과목을 하나만 고르세요</p>
    <input type="radio" name="subject">국어 
    <input type="radio" name="subject">영어 
    <input type="radio" name="subject">수학 

    <p>좋아하는 음식을 모두 고르세요</p>
    <input type="checkbox" name="food">제육볶음 
    <input type="checkbox" name="food">돈까스 
    <input type="checkbox" name="food">떡볶이
    
    <br><br>
    <!--드롭다운-->
    <select>
        <option>커피</option>
        <option>콜라</option>
        <option >쥬스</option>
        <option>생수</option>
    </select>

    <select>
        <option value="coffee">커피</option>
        <option value="coke">콜라</option>
        <option value="juice">쥬스</option>
        <option value="water" selected>생수</option>
    </select>

    <br><br>
    <!--여러 줄의 텍스트 입력-->
    <textarea cols="10" rows="6"></textarea>
    <textarea cols="10" rows="6">텍스트를 입력하세요.</textarea>

    <p>작업 진행 중... 60%...</p>
    <progress value="60" max="100"></progress>
</body>
</html>
